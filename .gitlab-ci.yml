# GitLab CI/CD Pipeline for Anish Karak's Portfolio (GitLab Pages)
image: node:22

stages:
  - build
  - deploy

build_test:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - dist/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    # GitLab Pages serves from 'public/'
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
